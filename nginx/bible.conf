# Nginx configuration for Bible App — web.net.ge
# დააკოპირეთ: /etc/nginx/conf.d/bible.conf

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    server_name web.net.ge www.web.net.ge biblegeo.eu.org www.biblegeo.eu.org;

    # სტატიკური ფაილები - Nginx-ის პირდაპირ მოწოდება (სწრაფი)
    location /static/ {
        alias /opt/bible_app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # აუდიო ფაილები - ხანგრძლივი კეშირება
    location /static/audio/ {
        alias /opt/bible_app/static/audio/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # robots.txt და sitemap.xml
    location = /robots.txt {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }

    # მუხლის გაზიარების ბმულები (/b/)
    location /b/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # IPTV Auth - საიდუმლო ბმულიდან cookie-ის დაყენება (მხოლოდ ჩემი კომპიუტერი)
    location = /iptv-auth/a6cbb269c9a9dfa495b505045acb467e19851262988e8d2c {
        add_header Set-Cookie "iptv_auth=a6cbb269c9a9dfa495b505045acb467e19851262988e8d2c; Path=/; HttpOnly; Secure; Max-Age=31536000; SameSite=Lax" always;
        default_type text/plain;
        return 200 "IPTV access granted. You can now view m3u files in browser.";
    }

    # IPTV Playlists - TV boxes (UA) OR authorized computer (cookie)
    # /1/1.m3u - /9/9.m3u
    location ~ ^/([1-9])/([0-9]+)\.m3u$ {
        limit_req zone=iptv_limit burst=50 nodelay;
        set $allowed 0;
        if ($http_user_agent ~* "Dalvik|VLC|Smart TV|SmartTV|Android TV|Google TV|BRAVIA|4KTV") {
            set $allowed 1;
        }
        if ($http_cookie ~* "iptv_auth=a6cbb269c9a9dfa495b505045acb467e19851262988e8d2c") {
            set $allowed 1;
        }
        if ($arg_token = "a6cbb269c9a9dfa495b505045acb467e19851262988e8d2c") {
            set $allowed 1;
        }
        if ($allowed = 0) {
            return 403;
        }
        root /opt/iptv;
        default_type audio/x-mpegurl;
        add_header Content-Type "audio/x-mpegurl" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # /tv/1q.m3u - /tv/9q.m3u, /tv/tv.m3u
    location ~ ^/tv/[a-z0-9]+\.m3u$ {
        limit_req zone=iptv_limit burst=50 nodelay;
        set $allowed 0;
        if ($http_user_agent ~* "Dalvik|VLC|Smart TV|SmartTV|Android TV|Google TV|BRAVIA|4KTV") {
            set $allowed 1;
        }
        if ($http_cookie ~* "iptv_auth=a6cbb269c9a9dfa495b505045acb467e19851262988e8d2c") {
            set $allowed 1;
        }
        if ($arg_token = "a6cbb269c9a9dfa495b505045acb467e19851262988e8d2c") {
            set $allowed 1;
        }
        if ($allowed = 0) {
            return 403;
        }
        root /opt/iptv;
        default_type audio/x-mpegurl;
        add_header Content-Type "audio/x-mpegurl" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # საძიებო API-ები - მკაცრი შეზღუდვა (2 req/s, burst=5)
    location ~ ^/api/search/ {
        limit_req zone=search_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # დანარჩენი ყველაფერი - Gunicorn-ზე
    location / {
        limit_req zone=general_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket მხარდაჭერა
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # timeout
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Gzip კომპრესია
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
    gzip_comp_level 6;

    # ფაილის ზომის ლიმიტი
    client_max_body_size 10M;
}
